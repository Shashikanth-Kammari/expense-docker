#version: "3.8"
name: expense
networks:
  default:
    name: expense
valumes:
  -data-volume:
services: 
  mysql:
    image: mysql:v1.0.0
    contianer_name: mysql # --name mysql
    valumes:
      - data-volume:/var/lib/mysql
  backend:
    image: backend:v1.0.0
    container_name: backend # --name backend
    depends_on: 
    - mysql
    command: sh -c "sleep 20 && node /opt/server/index.js"
  
  forntend:
    image: frontend:v1.0.0
    container_name: frontend # --name frontend
    depends_on: 
    - backend
    ports: 
    - "80:80"
  
